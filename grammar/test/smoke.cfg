# Exercises every highlight capture; used by CI to check the queries compile.
[stepper_x]
step_pin: PF13
dir_pin: !P1.24
endstop_pin: ^!EBBCan:PB6
rotation_distance: 40
serial: /dev/serial/by-id/usb-example
use_probe: true

[gcode_macro DEMO]
description: Example macro
variable_bed: 60
rename_existing: DEMO_BASE
gcode:
  {% set target = params.BED|default(printer["heater_bed"].target)|float %}
  {# comment #}
  G28
  {% if target is defined and target > 0 %}
    M140 S{target}
    RESPOND MSG="bed {target|int}"
  {% endif %}
  {action_respond_info("done")}

#*# <---------------------- SAVE_CONFIG ---------------------->
